<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas em HTML</title>
    <style>
        h1{
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border-collapse: collapse;
            margin: auto;
        }
        td{
            border: 1px solid black;
            width: 250px;
            height: 40px;
        }
        tr{
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            font-variant:small-caps;
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <table>
        <tr>
            <td> Segunda</td>
            <td>Terça</td>
            <td>Quarta</td>
        </tr>
        <tr>
            <td>Quinta</td>
            <td>Sexta</td>
            <td>Sábado</td>
        </tr>
        <tr>
            <td>Domingo</td>
            <td>Segunda</td>
            <td>Terça</td>
        </tr>
    </table>
    
</body>
</html>
