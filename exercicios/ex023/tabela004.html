<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de preferência de filmes</title>
    <style>
        table{
            border-collapse: collapse;
            font-size: 20px;
            font-family: Arial, Helvetica, sans-serif;
        }
        th,td{
            border: 1px solid black;
            height: 20px;
            text-align: center;
            padding: 10px; 
        }
        td{
            text-align: left;
        }
        th{
            font-family: Arial, Helvetica, sans-serif;
            background-color: lightgray;
            font-weight: bolder;
            font-size: 20px;
        }
    

    </style>
    </head>
<body>
    <table>
        <thead>
            <!--Inserção de "escopo à tabela tornando -a mais semântica"-->
            <th scope="col">Grupo</th>
            <th scope="col">Nomes</th>
            <th colspan="3" scope="colgroup">Filmes</th>
        </thead>
        <tr>
            <!--Inserção de "escopo à tabela tornando -a mais semântica"-->
            <th rowspan="3" scope="rowgroup">Mulheres</th>
            <td>Ana Maria Santos</td>
            <td>Alien</td>
            <td>Rambo</td>
            <td>Vingadores</td>
        </tr>
        <tr>
            <td> Beatriz Souza</td>
            <td>Hulk</td>
            <td>Inception</td>
            <td>Batman</td>
        </tr>
        <tr>
            <td>Claudia Melo</td>
            <td>Oblivion</td>
            <td>Matrix</td>
            <td>Big Hero</td>
        </tr>
        <tr>
            <!--Inserção de "escopo à tabela tornando -a mais semântica"-->
            <th rowspan="3" scope="rowgroup">Homens</th>
            <td>Bruno Mendonça</td>
            <td>Intocáveis</td>
            <td>Amnésia</td>
            <td>Gladiador</td>
        </tr>
        <tr>
            <td>Daniel Lourenço</td>
            <td>Wall-E</td>
            <td>Old Boy</td>
            <td>Dangal</td>

        </tr>
        <tr>
            <td>Fabiano Mota</td>
            <td>Star Wars 5</td>
            <td>Taxi Driver</td>
            <td>Toy Story</td>
        </tr>
    </table>
    
</body>
</html>
