<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando meu primeiro formulário</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
        h1{
            text-align: center;
        }
          input{
            margin: 5px;
            height: 30px;
            
        
        }
    </style>
    
</head>
<body>
    <main>
        <section>
             <h1>Cadastro de Currículo</h1>
            <form action="cadastro.php" method="get" autocomplete="on">
               <fieldset id="pessoais">
                 <legend>Dados Pessoais</legend>
                    <label for="inome">Nome Completo: <input type="text" name="nome" id="inome" minlength="15" maxlength="30" size="50"><label> <br>
                    <label for="iend">Endereço: <input type="text" name="end" id="iend" minlength="15" maxlength="50" size="50" autocomplete="address-level3" required style="padding-left: 50px;"></label> <br>
                    <label for="itel">Celular/Whatsapp: <input type="tel" name="tel" id="itel" autocomplete="tel" required></label> <br>
                    <label for="iemail">e-mail: <input type="email" name="email" id="iemail" required></label>
                </fieldset>
                <fieldset id="escolaridade"><legend>Escolaridade</legend></fieldset>
                <label for="igrau">Grau de Formação <input type="text" minlength="15" maxlength="30"size="50"></label>
                <fieldset id="experiencia"><legend>Experiência Profissional</legend></fieldset>
            </form>

        </section>
    </main>
   
</body>
</html>
